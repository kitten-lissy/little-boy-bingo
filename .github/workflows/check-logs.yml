name: Check team logs

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-logs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check logs
        run: python scripts/check_logs.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update team log status"
            git push
          fi
